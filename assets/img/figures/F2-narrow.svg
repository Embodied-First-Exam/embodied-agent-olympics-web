<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1140" role="img" aria-labelledby="F2n-title" aria-label="The same five-stage table-tennis control chain, stacked for a phone. The Athlete owns stage one. The Engineer owns stages one through four. Joint servos and physics are shared, with real limits. Public inverse-kinematics tools and an offline debugging loop are available to the Engineer.">
<title id="F2n-title">Table-tennis control chain and the two modes</title>
<style>
.F2n-heading{font-family:"Bricolage Grotesque",Inter,sans-serif;font-weight:700;fill:var(--ink,#0f141a)}
.F2n-text{font-family:Inter,sans-serif;fill:var(--ink,#0f141a)}
.F2n-muted{font-family:Inter,sans-serif;fill:var(--ink-2,#444e5b)}
.F2n-mono{font-family:"JetBrains Mono",ui-monospace,monospace;fill:var(--ink-2,#444e5b);font-size:12px}
.F2n-card{fill:var(--surface,#ffffff);stroke:var(--line,rgba(15,23,42,.10));stroke-width:1}
.F2n-panel{fill:var(--bg-2,#eaeef3);stroke:var(--line,rgba(15,23,42,.10));stroke-width:1}
.F2n-line{fill:none;stroke:var(--ink-2,#444e5b);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
</style>
<text x="16" y="29" font-size="25" class="F2n-heading">
<tspan x="16" dy="0">Table-tennis</tspan>
<tspan x="16" dy="28">control chain</tspan>
</text>
<text x="16" y="81" font-size="14" class="F2n-muted">
<tspan x="16" dy="0">Two modes, different responsibilities.</tspan>
</text>
<rect x="16" y="102" width="328" height="98" rx="14" class="F2n-panel" stroke-dasharray="5 5"/>
<text x="32" y="129" font-size="16" class="F2n-heading">
<tspan x="32" dy="0">“Play a forehand”</tspan>
</text>
<text x="32" y="153" font-size="14" class="F2n-muted">
<tspan x="32" dy="0">Not offered: it would make the hard</tspan>
<tspan x="32" dy="21">decisions for the agent.</tspan>
</text>
<rect x="16" y="218" width="328" height="105" rx="14" class="F2n-card"/>
<text x="32" y="246" font-size="20" class="F2n-heading">
<tspan x="32" dy="0">Athlete</tspan>
</text>
<text x="32" y="272" font-size="14" class="F2n-text" font-weight="600">
<tspan x="32" dy="0">Owns stage 1</tspan>
</text>
<text x="32" y="298" font-size="14" class="F2n-muted">
<tspan x="32" dy="0">Stages 2–4 are platform motor skills.</tspan>
</text>
<rect x="16" y="337" width="328" height="126" rx="14" class="F2n-card"/>
<text x="32" y="365" font-size="20" class="F2n-heading">
<tspan x="32" dy="0">Engineer</tspan>
</text>
<text x="32" y="391" font-size="14" class="F2n-text" font-weight="600">
<tspan x="32" dy="0">Owns stages 1–4</tspan>
</text>
<text x="32" y="417" font-size="14" class="F2n-muted">
<tspan x="32" dy="0">Builds the motor skills. May use public</tspan>
<tspan x="32" dy="21">tools, such as an IK library.</tspan>
</text>
<rect x="16" y="493" width="328" height="110" rx="14" class="F2n-card"/>
<circle cx="42" cy="520" r="12" fill="var(--bg-2,#eaeef3)" stroke="var(--line-2,rgba(15,23,42,.22))"/>
<text x="42" y="524" font-size="12" class="F2n-mono" text-anchor="middle">
<tspan x="42" dy="0">1</tspan>
</text>
<text x="63" y="525" font-size="16" class="F2n-heading">
<tspan x="63" dy="0">Hit decision</tspan>
</text>
<text x="34" y="551" font-size="14" class="F2n-muted">
<tspan x="34" dy="0">When, paddle pose and velocity</tspan>
</text>
<text x="34" y="576" font-size="12" class="F2n-mono">
<tspan x="34" dy="0">Example: hit in 0.24 s</tspan>
<tspan x="34" dy="18">at pose X, velocity V.</tspan>
</text>
<path d="M180 606V618m-4 -4 4 4 4 -4" class="F2n-line"/>
<rect x="16" y="623" width="328" height="74" rx="14" class="F2n-card"/>
<circle cx="42" cy="650" r="12" fill="var(--bg-2,#eaeef3)" stroke="var(--line-2,rgba(15,23,42,.22))"/>
<text x="42" y="654" font-size="12" class="F2n-mono" text-anchor="middle">
<tspan x="42" dy="0">2</tspan>
</text>
<text x="63" y="655" font-size="16" class="F2n-heading">
<tspan x="63" dy="0">Trajectory</tspan>
</text>
<text x="34" y="681" font-size="14" class="F2n-muted">
<tspan x="34" dy="0">Paddle motion over time</tspan>
</text>
<path d="M180 700V712m-4 -4 4 4 4 -4" class="F2n-line"/>
<rect x="16" y="717" width="328" height="74" rx="14" class="F2n-card"/>
<circle cx="42" cy="744" r="12" fill="var(--bg-2,#eaeef3)" stroke="var(--line-2,rgba(15,23,42,.22))"/>
<text x="42" y="748" font-size="12" class="F2n-mono" text-anchor="middle">
<tspan x="42" dy="0">3</tspan>
</text>
<text x="63" y="749" font-size="16" class="F2n-heading">
<tspan x="63" dy="0">Inverse kinematics</tspan>
</text>
<text x="34" y="775" font-size="14" class="F2n-muted">
<tspan x="34" dy="0">Paddle pose → 7 joint angles</tspan>
</text>
<path d="M180 794V806m-4 -4 4 4 4 -4" class="F2n-line"/>
<rect x="16" y="811" width="328" height="82" rx="14" class="F2n-card"/>
<circle cx="42" cy="838" r="12" fill="var(--bg-2,#eaeef3)" stroke="var(--line-2,rgba(15,23,42,.22))"/>
<text x="42" y="842" font-size="12" class="F2n-mono" text-anchor="middle">
<tspan x="42" dy="0">4</tspan>
</text>
<text x="63" y="843" font-size="16" class="F2n-heading">
<tspan x="63" dy="0">Control and tracking</tspan>
</text>
<text x="34" y="869" font-size="14" class="F2n-muted">
<tspan x="34" dy="0">Joint targets corrected</tspan>
<tspan x="34" dy="19">from feedback</tspan>
</text>
<path d="M180 896V908m-4 -4 4 4 4 -4" class="F2n-line"/>
<rect x="16" y="913" width="328" height="96" rx="14" class="F2n-panel"/>
<circle cx="42" cy="940" r="12" fill="var(--bg-2,#eaeef3)" stroke="var(--line-2,rgba(15,23,42,.22))"/>
<text x="42" y="944" font-size="12" class="F2n-mono" text-anchor="middle">
<tspan x="42" dy="0">5</tspan>
</text>
<text x="63" y="945" font-size="16" class="F2n-heading">
<tspan x="63" dy="0">Joint servos and physics</tspan>
</text>
<text x="34" y="971" font-size="14" class="F2n-muted">
<tspan x="34" dy="0">MuJoCo; same for both modes.</tspan>
<tspan x="34" dy="19">Real limits enforced.</tspan>
</text>
<rect x="16" y="1029" width="328" height="95" rx="14" class="F2n-panel"/>
<text x="32" y="1056" font-size="17" class="F2n-heading">
<tspan x="32" dy="0">Engineer debug loop</tspan>
</text>
<text x="32" y="1083" font-size="14" class="F2n-muted">
<tspan x="32" dy="0">Offline tests → inspect failures</tspan>
<tspan x="32" dy="21">→ tune parameters</tspan>
</text>
</svg>
