<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 652" role="img" aria-label="Four match formats: single, duel, team and multi-party"><title>Four match formats</title><style>
.formats-card{fill:var(--surface,#ffffff);stroke:var(--line-2,rgba(15,23,42,.22));stroke-width:1}
.formats-heading{font-family:var(--display,'Bricolage Grotesque',Inter,system-ui,sans-serif);font-size:23px;font-weight:700;fill:var(--ink,#0f141a)}
.formats-body{font-family:var(--body,Inter,system-ui,sans-serif);font-size:16px;fill:var(--ink-2,#444e5b)}
.formats-label{font-family:var(--mono,'JetBrains Mono',monospace);font-size:12px;letter-spacing:1px;fill:var(--ink-3,#69727f)}
.formats-ink{fill:none;stroke:var(--ink,#0f141a);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.formats-a{fill:var(--team-a,#E8573A)}.formats-b{fill:var(--team-b,#2F7BEA)}
.formats-status{fill:var(--prelim-ink,#8A5A12);font-family:var(--body,Inter,system-ui,sans-serif);font-size:14px}
</style><g transform="translate(12 12)"><rect width="340" height="300" rx="20" class="formats-card"/><text x="24" y="40" class="formats-heading">Single</text><text x="24" y="61" class="formats-label">1 SEAT</text><rect x="24" y="76" width="32" height="32" rx="8" class="formats-ink formats-a"/><path d="M67 92h18" class="formats-ink"/><rect x="96" y="76" width="32" height="32" rx="8" class="formats-ink" stroke-dasharray="3 4"/><text x="24" y="143" class="formats-body">A scripted opponent, or no opponent.</text><text x="24" y="166" class="formats-body">Scripted levels vary by sport.</text><text x="24" y="201" class="formats-body">Archery, bowling, putting</text><text x="24" y="260" class="formats-label">RANKED BY</text><text x="24" y="283" class="formats-body">Result per level or score</text></g><g transform="translate(368 12)"><rect width="340" height="300" rx="20" class="formats-card"/><text x="24" y="40" class="formats-heading">Duel</text><text x="24" y="61" class="formats-label">2 SIDES × 1 SEAT</text><rect x="24" y="76" width="32" height="32" rx="8" class="formats-ink formats-a"/><path d="M67 92h18" class="formats-ink"/><rect x="96" y="76" width="32" height="32" rx="8" class="formats-ink formats-b"/><text x="24" y="143" class="formats-body">Two players head to head.</text><text x="24" y="166" class="formats-body">Play both sides on fixed seeds.</text><text x="24" y="201" class="formats-body">Table tennis, tennis, fencing, billiards</text><text x="24" y="260" class="formats-label">RANKED BY</text><text x="24" y="283" class="formats-body">Wins</text></g><g transform="translate(12 328)"><rect width="340" height="300" rx="20" class="formats-card"/><text x="24" y="40" class="formats-heading">Team</text><text x="24" y="61" class="formats-label">2 SIDES × k SEATS</text><rect x="24" y="72" width="22" height="22" rx="6" class="formats-ink formats-a"/><rect x="53" y="88" width="22" height="22" rx="6" class="formats-ink formats-a"/><rect x="99" y="72" width="22" height="22" rx="6" class="formats-ink formats-b"/><rect x="128" y="88" width="22" height="22" rx="6" class="formats-ink formats-b"/><text x="24" y="143" class="formats-body">One player per robot.</text><text x="24" y="166" class="formats-body">Teammates use a team channel.</text><text x="24" y="201" class="formats-body">Soccer 2v2</text><text x="24" y="224" class="formats-status">Basketball 3x3: in development</text><text x="24" y="260" class="formats-label">RANKED BY</text><text x="24" y="283" class="formats-body">Team wins</text></g><g transform="translate(368 328)"><rect width="340" height="300" rx="20" class="formats-card"/><text x="24" y="40" class="formats-heading">Multi-party</text><text x="24" y="61" class="formats-label">N SIDES × 1 SEAT</text><path d="M24 72v40M58 72v40M92 72v40M126 72v40" class="formats-ink"/><rect x="15" y="79" width="18" height="20" rx="5" class="formats-ink formats-a"/><rect x="49" y="88" width="18" height="20" rx="5" class="formats-ink formats-b"/><rect x="83" y="72" width="18" height="20" rx="5" class="formats-ink formats-a"/><rect x="117" y="84" width="18" height="20" rx="5" class="formats-ink formats-b"/><text x="24" y="143" class="formats-body">All players in the same event</text><text x="24" y="166" class="formats-body">at the same time.</text><text x="24" y="201" class="formats-body">Robot racing: 4 cars</text><text x="24" y="260" class="formats-label">RANKED BY</text><text x="24" y="283" class="formats-body">Places converted to points</text></g></svg>
