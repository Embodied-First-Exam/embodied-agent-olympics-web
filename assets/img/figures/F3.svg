<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 976" role="img" aria-labelledby="F3-title" aria-label="Nine declared abilities in three groups. Understanding the physical world is the core: 3D spatial understanding, physical dynamics, embodiment and execution, time and latency. Understanding the game builds on it: rules, strategy and reading the opponent, teamwork. The coding agent uses real-time programming and learning during the match in every sport.">
<title id="F3-title">Nine abilities in three groups</title>
<style>
.F3-heading{font-family:"Bricolage Grotesque",Inter,sans-serif;font-weight:700;fill:var(--ink,#0f141a)}
.F3-text{font-family:Inter,sans-serif;fill:var(--ink,#0f141a)}
.F3-muted{font-family:Inter,sans-serif;fill:var(--ink-2,#444e5b)}
.F3-mono{font-family:"JetBrains Mono",ui-monospace,monospace;fill:var(--ink-2,#444e5b);font-size:12px}
.F3-card{fill:var(--surface,#ffffff);stroke:var(--line,rgba(15,23,42,.10));stroke-width:1}
.F3-panel{fill:var(--bg-2,#eaeef3);stroke:var(--line,rgba(15,23,42,.10));stroke-width:1}
.F3-line{fill:none;stroke:var(--ink-2,#444e5b);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
</style>
<text x="16" y="29" font-size="26" class="F3-heading">
<tspan x="16" dy="0">Nine abilities, three groups</tspan>
</text>
<text x="16" y="56" font-size="15" class="F3-muted">
<tspan x="16" dy="0">The physical world is the core. Game understanding builds on it.</tspan>
</text>
<text x="16" y="78" font-size="15" class="F3-muted">
<tspan x="16" dy="0">Programming is how the agent does both.</tspan>
</text>
<rect x="16" y="98" width="688" height="364" rx="20" class="F3-panel"/>
<text x="36" y="129" font-size="22" class="F3-heading">
<tspan x="36" dy="0">Understanding the physical world</tspan>
</text>
<text x="684" y="129" font-size="12" class="F3-mono" text-anchor="end">
<tspan x="684" dy="0">CORE</tspan>
</text>
<text x="36" y="153" font-size="14" class="F3-muted">
<tspan x="36" dy="0">Camera images, real physics and a body that takes time to act.</tspan>
</text>
<rect x="32" y="170" width="320" height="130" rx="14" class="F3-card"/>
<text x="48" y="197" font-size="16" class="F3-heading">
<tspan x="48" dy="0">3D spatial understanding</tspan>
</text>
<text x="48" y="230" font-size="13" class="F3-muted">
<tspan x="48" dy="0">Recover position, depth and orientation</tspan>
<tspan x="48" dy="19">from camera images. Reason about</tspan>
<tspan x="48" dy="19">3D lines and slopes.</tspan>
</text>
<text x="48" y="286" font-size="12" class="F3-mono">
<tspan x="48" dy="0">Primary: 14 of 18 sports</tspan>
</text>
<rect x="368" y="170" width="320" height="130" rx="14" class="F3-card"/>
<text x="384" y="197" font-size="16" class="F3-heading">
<tspan x="384" dy="0">Physical dynamics</tspan>
</text>
<text x="384" y="230" font-size="13" class="F3-muted">
<tspan x="384" dy="0">Predict flight, spin, bounce, friction</tspan>
<tspan x="384" dy="19">and collisions. Infer parameters</tspan>
<tspan x="384" dy="19">such as friction and wind.</tspan>
</text>
<text x="384" y="286" font-size="12" class="F3-mono">
<tspan x="384" dy="0">Primary: 14 of 18 sports</tspan>
</text>
<rect x="32" y="316" width="320" height="130" rx="14" class="F3-card"/>
<text x="48" y="343" font-size="16" class="F3-heading">
<tspan x="48" dy="0">Embodiment and execution</tspan>
</text>
<text x="48" y="376" font-size="13" class="F3-muted">
<tspan x="48" dy="0">Know the body’s reach, speed and torque.</tspan>
<tspan x="48" dy="19">Turn intent into accurate action.</tspan>
<tspan x="48" dy="19">Engineer mode: build the control stack.</tspan>
</text>
<text x="48" y="432" font-size="12" class="F3-mono">
<tspan x="48" dy="0">Primary: every sport</tspan>
</text>
<rect x="368" y="316" width="320" height="130" rx="14" class="F3-card"/>
<text x="384" y="343" font-size="16" class="F3-heading">
<tspan x="384" dy="0">Time and latency</tspan>
</text>
<text x="384" y="376" font-size="13" class="F3-muted">
<tspan x="384" dy="0">Account for image age, thinking time</tspan>
<tspan x="384" dy="19">and arm response. Act for the world</tspan>
<tspan x="384" dy="19">when the action will take effect.</tspan>
</text>
<text x="384" y="432" font-size="12" class="F3-mono">
<tspan x="384" dy="0">Primary: 8 of 18 sports</tspan>
</text>
<rect x="16" y="482" width="688" height="226" rx="20" class="F3-panel"/>
<text x="36" y="514" font-size="22" class="F3-heading">
<tspan x="36" dy="0">Understanding the game</tspan>
</text>
<text x="36" y="538" font-size="14" class="F3-muted">
<tspan x="36" dy="0">Built on physical understanding.</tspan>
</text>
<rect x="32" y="556" width="208" height="136" rx="14" class="F3-card"/>
<text x="48" y="583" font-size="16" class="F3-heading">
<tspan x="48" dy="0">Rules</tspan>
</text>
<text x="48" y="616" font-size="13" class="F3-muted">
<tspan x="48" dy="0">Know, use and obey</tspan>
<tspan x="48" dy="19">the scoring and foul rules.</tspan>
</text>
<text x="48" y="678" font-size="12" class="F3-mono">
<tspan x="48" dy="0">Primary: 6 of 18 sports</tspan>
</text>
<rect x="256" y="556" width="208" height="136" rx="14" class="F3-card"/>
<text x="272" y="583" font-size="16" class="F3-heading">
<tspan x="272" dy="0">Strategy and reading</tspan>
<tspan x="272" dy="21">the opponent</tspan>
</text>
<text x="272" y="630" font-size="13" class="F3-muted">
<tspan x="272" dy="0">Judge risk and plan ahead.</tspan>
<tspan x="272" dy="19">Exploit opponent habits.</tspan>
</text>
<text x="272" y="678" font-size="12" class="F3-mono">
<tspan x="272" dy="0">Primary: 9 of 18 sports</tspan>
</text>
<rect x="480" y="556" width="208" height="136" rx="14" class="F3-card"/>
<text x="496" y="583" font-size="16" class="F3-heading">
<tspan x="496" dy="0">Teamwork</tspan>
</text>
<text x="496" y="616" font-size="13" class="F3-muted">
<tspan x="496" dy="0">Share roles, pass into space,</tspan>
<tspan x="496" dy="19">move and communicate.</tspan>
</text>
<text x="496" y="678" font-size="12" class="F3-mono">
<tspan x="496" dy="0">Primary: 1 of 18 sports</tspan>
</text>
<rect x="16" y="728" width="688" height="184" rx="20" class="F3-panel"/>
<text x="36" y="760" font-size="22" class="F3-heading">
<tspan x="36" dy="0">The coding agent</tspan>
</text>
<text x="684" y="760" font-size="12" class="F3-mono" text-anchor="end">
<tspan x="684" dy="0">EVERY SPORT</tspan>
</text>
<rect x="32" y="779" width="320" height="117" rx="14" class="F3-card"/>
<text x="48" y="806" font-size="16" class="F3-heading">
<tspan x="48" dy="0">Real-time programming</tspan>
</text>
<text x="48" y="839" font-size="13" class="F3-muted">
<tspan x="48" dy="0">Write perception, prediction and strategy</tspan>
<tspan x="48" dy="19">as a real-time program. Debug in the match.</tspan>
</text>
<text x="48" y="882" font-size="12" class="F3-mono">
<tspan x="48" dy="0">Primary: every sport</tspan>
</text>
<rect x="368" y="779" width="320" height="117" rx="14" class="F3-card"/>
<text x="384" y="806" font-size="16" class="F3-heading">
<tspan x="384" dy="0">Learning during the match</tspan>
</text>
<text x="384" y="839" font-size="13" class="F3-muted">
<tspan x="384" dy="0">After each point, find why it was lost.</tspan>
<tspan x="384" dy="19">Change the program or the plan.</tspan>
</text>
<text x="384" y="882" font-size="12" class="F3-mono">
<tspan x="384" dy="0">Primary: every sport</tspan>
</text>
<text x="16" y="937" font-size="14" class="F3-muted">
<tspan x="16" dy="0">Marks are declared by the authors from each sport’s rules and play.</tspan>
</text>
<text x="16" y="961" font-size="14" class="F3-muted">
<tspan x="16" dy="0">Teamwork: soccer 2 v 2 only. Basketball 3x3 is in development.</tspan>
</text>
</svg>
