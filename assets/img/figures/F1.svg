<text x="360" y="196" class="F1-t F1-inverse" text-anchor="middle">Match flow</text>
<text x="360" y="220" class="F1-t F1-inverse" text-anchor="middle">Rules · recording</text>
<text x="360" y="244" class="F1-t F1-inverse" text-anchor="middle">Judging</text>
<path d="M360 272V416" class="F1-arrow" marker-end="url(#F1-arrowhead)"/>
<rect x="279" y="328" width="162" height="30" rx="14" class="F1-card"/>
<text x="360" y="348" class="F1-s" text-anchor="middle">03 · Match record</text>
<rect x="494" y="326" width="210" height="76" rx="14" class="F1-card" stroke-dasharray="5 4"/>
<text x="599" y="353" class="F1-t" text-anchor="middle">Shared robot library</text>
<text x="599" y="376" class="F1-small" text-anchor="middle">Sports may reference it</text>
<text x="599" y="393" class="F1-small" text-anchor="middle">Separate from the framework</text>
<rect x="16" y="424" width="688" height="124" rx="20" class="F1-card"/>
<text x="32" y="458" class="F1-h">Tools</text>
<text x="112" y="457" class="F1-s">Files only; never changes a result</text>
