<text x="599.0" y="249" class="F1-t" text-anchor="middle">Fencing</text>
<rect x="510" y="274" width="178" height="24" rx="14" class="F1-card" stroke-dasharray="5 4"/>
<text x="599.0" y="291" class="F1-small" text-anchor="middle">More sports can be added</text>
<text x="251" y="64" class="F1-mono" text-anchor="middle">01</text>
<text x="251" y="85" class="F1-s" text-anchor="middle">Player</text>
<text x="251" y="103" class="F1-s" text-anchor="middle">protocol</text>
