<rect x="16" y="570" width="688" height="122" rx="20" class="F1-soft"/>
<text x="32" y="605" class="F1-h">Runs on Harbor</text>
<text x="32" y="637" class="F1-t">Single-player: stock Harbor</text>
<text x="32" y="663" class="F1-t">Duels: multi-seat extension</text>
<text x="376" y="637" class="F1-t">Separate grading container</text>
<text x="376" y="663" class="F1-t">Replay + state-hash check</text>
</svg>
