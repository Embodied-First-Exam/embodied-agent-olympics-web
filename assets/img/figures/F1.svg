<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 712" role="img" aria-label="Players connect through the player protocol to a narrow core. The core calls sports through the sport interface and writes a match record for tools. Sports may reference a shared robot library. Matches run on Harbor, and grading replays in a separate container." aria-labelledby="F1-title">
<title id="F1-title">One framework: four parts, three contracts</title>
<style>
.F1-card{fill:var(--surface,#ffffff);stroke:var(--line-2,rgba(15,23,42,.22));stroke-width:1}
.F1-soft{fill:var(--bg-2,#eaeef3);stroke:var(--line,rgba(15,23,42,.10));stroke-width:1}
.F1-fan{fill:var(--bg-2,#eaeef3)}
.F1-core{fill:var(--primary-bg,#0f141a)}
.F1-h{font:700 22px "Bricolage Grotesque",Inter,system-ui,sans-serif;fill:var(--ink,#0f141a)}
.F1-t{font:400 16px Inter,system-ui,sans-serif;fill:var(--ink,#0f141a)}
.F1-s{font:400 14px Inter,system-ui,sans-serif;fill:var(--ink-2,#444e5b)}
.F1-small{font:400 12px Inter,system-ui,sans-serif;fill:var(--ink-2,#444e5b)}
.F1-mono{font:500 12px "JetBrains Mono",ui-monospace,monospace;letter-spacing:.08em;fill:var(--ink-2,#444e5b)}
.F1-inverse{fill:var(--primary-ink,#f7f9fb)}
.F1-arrow{fill:none;stroke:var(--ink-2,#444e5b);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs><marker id="F1-arrowhead" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 7 4 1 7" fill="none" stroke="var(--ink-2,#444e5b)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<path d="M226 66 276 128V272L226 302Z M494 66 444 128V272L494 302Z" class="F1-fan"/>
<rect x="16" y="24" width="210" height="282" rx="20" class="F1-card"/>
<text x="32" y="57" class="F1-h">Players</text>
<text x="32" y="82" class="F1-t">Model + harness</text>
<text x="32" y="102" class="F1-s">+ play setting</text>
<rect x="32" y="122" width="178" height="42" rx="14" class="F1-soft"/>
<text x="44" y="141" class="F1-t">Opus 5.5</text>
<text x="44" y="157" class="F1-small">Claude Code</text>
<rect x="32" y="172" width="178" height="42" rx="14" class="F1-soft"/>
<text x="44" y="191" class="F1-t">Fable 5.1</text>
<text x="44" y="207" class="F1-small">Claude Code</text>
<rect x="32" y="222" width="178" height="42" rx="14" class="F1-soft"/>
<text x="44" y="241" class="F1-t">GPT-6</text>
<text x="44" y="257" class="F1-small">Codex</text>
<rect x="32" y="274" width="178" height="24" rx="14" class="F1-card" stroke-dasharray="5 4"/>
<text x="121.0" y="291" class="F1-small" text-anchor="middle">More players can be added</text>
<rect x="494" y="24" width="210" height="282" rx="20" class="F1-card"/>
<text x="510" y="57" class="F1-h">Sports</text>
<text x="510" y="82" class="F1-s">World · actions · referee</text>
<text x="510" y="102" class="F1-s">+ observations</text>
<rect x="510" y="122" width="178" height="42" rx="14" class="F1-soft"/>
<text x="599.0" y="149" class="F1-t" text-anchor="middle">Table tennis</text>
